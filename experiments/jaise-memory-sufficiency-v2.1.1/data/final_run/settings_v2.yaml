model:
  backend_url: "http://127.0.0.1:8033/v1"
  name: "gpt-oss-20b"
  request_timeout_sec: 180
  max_retries: 2
  retry_backoff_sec: 1.0
  reasoning_format: "auto"
  cache_prompt: false
  agent_generation:
    Teacher:
      temperature: 0.2
      max_tokens: 1536
      reasoning_effort: "low"
    Adapter:
      temperature: 0.2
      max_tokens: 1280
      reasoning_effort: "low"
    Evaluator:
      temperature: 0.0
      max_tokens: 640
      reasoning_effort: "low"

experiment:
  version: "2.1.1"
  master_seed: 26092026
  smoke_repetitions: 1
  pilot_repetitions: 2
  full_repetitions: 15
  conditions: ["C0", "C1", "C2", "C3", "C4"]
  rounds_per_episode: 3
  randomized_complete_blocks: true
  warmup_calls: 3
  cooldown_sec: 2.0
  continue_after_failure: true

energy:
  gpu_index: 0
  sample_interval_sec: 0.2
  baseline_duration_sec: 3.0
  store_raw_samples: true

memory:
  c1_max_chars: 1800
  c2_max_chars: 3200
  c3_top_k: 3
  c3_max_chars: 2200
  c4_max_chars: 1600

logging:
  root_dir: "logs_v2"
  store_final_outputs: true
  store_reasoning_text: false
